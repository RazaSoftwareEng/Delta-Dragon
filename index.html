<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Delta Dragon — web development and design services offering customized solutions to create visually appealing, user-friendly, and functional websites."
    />
    <meta name="theme-color" content="#400a0e" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <title>Delta Dragon | Web Design & Development</title>

  <body>
    <!-- Static copy of the contact form so Netlify Forms can detect it at build time -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <input name="service" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
